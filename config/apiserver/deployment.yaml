# L3 aggregated sandbox-apiserver workload (cmd/sandbox-apiserver, built via
# Dockerfile.apiserver / `make apiserver-image`).
#
# The server is stateless (it stores nothing; List/Get/Watch scatter-gather
# per-node NodeInventory objects through an informer cache), so two replicas
# behind the cocoon-sandbox-apiserver Service (service.yaml) give the
# kube-apiserver an always-available aggregation backend.
#
# Serving certs come from cert-manager (certificate.yaml): the secret is
# mounted and passed via --tls-cert-file/--tls-private-key-file, and the
# APIService (config/apiservice/) pins the matching CA via
# cert-manager.io/inject-ca-from. RBAC for delegated authn/authz and the
# NodeInventory read path is in rbac.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cocoon-sandbox-apiserver
  namespace: cocoon-sandbox-system
  labels:
    app.kubernetes.io/name: cocoon-sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cocoon-sandbox-apiserver
  namespace: cocoon-sandbox-system
  labels:
    app.kubernetes.io/name: cocoon-sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cocoon-sandbox-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cocoon-sandbox-apiserver
        app.kubernetes.io/component: aggregated-apiserver
    spec:
      serviceAccountName: cocoon-sandbox-apiserver
      # An unavailable APIService does not just fail `kubectl get sandboxes`: it
      # fails discovery for the whole cluster, so the two replicas must never
      # share a failure domain. Spreading is required, not preferred — running
      # both on one node is worse than running one, because it turns a single
      # drain into a cluster-wide discovery outage.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cocoon-sandbox-apiserver
      containers:
      - name: cocoon-sandbox-apiserver
        image: ko://github.com/cocoonstack/sandbox-operator/cmd/sandbox-apiserver # placeholder value, replaced by deployment scripts
        args:
        - --secure-port=6443
        - --tls-cert-file=/etc/cocoon-sandbox-apiserver/serving-certs/tls.crt
        - --tls-private-key-file=/etc/cocoon-sandbox-apiserver/serving-certs/tls.key
        ports:
        - name: https
          containerPort: 6443
          protocol: TCP
        # genericapiserver endpoints: /livez for liveness, /readyz for readiness
        # (readyz flips on shutdown so the Service drains before termination).
        livenessProbe:
          httpGet:
            path: /livez
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: serving-certs
          mountPath: /etc/cocoon-sandbox-apiserver/serving-certs
          readOnly: true
      volumes:
      - name: serving-certs
        secret:
          secretName: cocoon-sandbox-apiserver-serving-certs
