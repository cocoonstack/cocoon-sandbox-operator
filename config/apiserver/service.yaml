# Backing Service the v1beta1.agents.x-k8s.io APIService resolves to (this is
# the single Service definition for the aggregated apiserver — the APIService in
# config/apiservice/ references it by name). Selects the Deployment pods, which
# serve HTTPS on 6443.
---
apiVersion: v1
kind: Service
metadata:
  name: cocoon-sandbox-apiserver
  namespace: cocoon-sandbox-system
  labels:
    app.kubernetes.io/name: cocoon-sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
spec:
  selector:
    app.kubernetes.io/name: cocoon-sandbox-apiserver
  ports:
  - name: https
    port: 443
    targetPort: 6443
    protocol: TCP
