# Serving-cert chain for the aggregated sandbox-apiserver (requires
# cert-manager): self-signed Issuer → CA Certificate → CA Issuer → serving
# Certificate for the Service DNS name. The serving secret is mounted by the
# Deployment; the APIService (config/apiservice/) gets the CA via its
# cert-manager.io/inject-ca-from annotation, which points at the serving
# Certificate below — so the kube-apiserver fully verifies the aggregated
# server's TLS and no TLS-verify escape hatch is needed.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: sandbox-apiserver-selfsigned
  namespace: cocoon-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sandbox-apiserver-ca
  namespace: cocoon-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
spec:
  isCA: true
  commonName: sandbox-apiserver-ca
  secretName: sandbox-apiserver-ca
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: sandbox-apiserver-selfsigned
    kind: Issuer

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: sandbox-apiserver-ca
  namespace: cocoon-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
spec:
  ca:
    secretName: sandbox-apiserver-ca

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sandbox-apiserver-serving
  namespace: cocoon-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
spec:
  dnsNames:
  - sandbox-apiserver.cocoon-sandbox-system.svc
  - sandbox-apiserver.cocoon-sandbox-system.svc.cluster.local
  secretName: sandbox-apiserver-serving-certs
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  issuerRef:
    name: sandbox-apiserver-ca
    kind: Issuer
