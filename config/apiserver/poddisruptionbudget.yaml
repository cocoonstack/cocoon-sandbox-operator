# The aggregated apiserver backs an APIService, and an unavailable APIService
# degrades discovery for the entire cluster — not just this group. A node drain
# (an upgrade, a scale-in, a maintenance cordon) must therefore never be allowed
# to take both replicas at once.
#
# minAvailable: 1 rather than maxUnavailable: 1 on purpose: it holds even if the
# Deployment is ever scaled to 1, where maxUnavailable: 1 would still permit
# evicting the only replica.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandbox-apiserver
  namespace: sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-apiserver
    app.kubernetes.io/component: aggregated-apiserver
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-apiserver
