apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-loadgen
  namespace: sandboxd-test
---
# Namespaced RBAC: loadgen manages its Template/WarmPool/Claims in sandboxd-test.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-loadgen
  namespace: sandboxd-test
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools", "sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-loadgen
  namespace: sandboxd-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-loadgen
subjects:
  - kind: ServiceAccount
    name: sandbox-loadgen
    namespace: sandboxd-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-loadgen
  namespace: sandboxd-test
  labels: { app: sandbox-loadgen }
spec:
  replicas: 1
  selector:
    matchLabels: { app: sandbox-loadgen }
  template:
    metadata:
      labels: { app: sandbox-loadgen }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sandbox-loadgen
      # keep the exporter off the microVM pool hosts (land on standard VKE workers)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: type
                    operator: NotIn
                    values: ["virtual-kubelet"]
      containers:
        - name: loadgen
          image: mindset-ap-southeast-1.cr.volces.com/g0031/sandbox-loadgen:v8
          args:
            - --replicas=100                # SandboxWarmPool size (pre-warmed sandboxes)
            - --namespace=sandboxd-test
            - --template=ghcr.io/cocoonstack/sandbox/rt@sha256:c8cab53a1e1684e6c0c95a06855001b0535be2862b7d4f72658f9f0e784c8778
            - --created-by=loadgen
            - --metrics-addr=:9090
            - --claim-interval=1s           # gap between serial claims
            - --poll=25ms                   # readiness poll (ms resolution)
          ports:
            - { name: metrics, containerPort: 9090 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            # 512Mi: the sandbox watch keeps a pruned (metadata-only) cache, but
            # leave headroom for 50k-object pools; 256Mi OOMed at 10k pre-prune.
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-loadgen
  namespace: sandboxd-test
  labels: { app: sandbox-loadgen }
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  # headless: the cluster's Service-IP /24 is exhausted by leaked orphan
  # Services, so we allocate no ClusterIP. vmagent scrapes via the Endpoints
  # (DNS returns the pod IP) at sandbox-loadgen.sandboxd-test.svc:9090.
  clusterIP: None
  selector: { app: sandbox-loadgen }
  ports:
    - { name: metrics, port: 9090, targetPort: 9090 }
