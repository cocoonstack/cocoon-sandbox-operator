# sandbox-sdk-loadgen: persistent-client Create(Sandbox) latency benchmark.
# Ships at replicas 0 — scale to 1 to start a run:
#   kubectl -n sandbox-sdk-loadgen scale deploy/sandbox-sdk-loadgen --replicas=1
# Tune load via the container args (concurrency / total / cleanup / interval).
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-sdk-loadgen
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-sdk-loadgen
  namespace: sandbox-sdk-loadgen
imagePullSecrets:
- name: mindset-cr
---
# CRUD on the aggregated sandboxes resource. This is the ONLY object the loadgen
# touches; it never reads NodeInventory or any desktop/CocoonSet resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-sdk-loadgen
rules:
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-sdk-loadgen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-sdk-loadgen
subjects:
- kind: ServiceAccount
  name: sandbox-sdk-loadgen
  namespace: sandbox-sdk-loadgen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-sdk-loadgen
  namespace: sandbox-sdk-loadgen
  labels:
    app: sandbox-sdk-loadgen
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sandbox-sdk-loadgen
  template:
    metadata:
      labels:
        app: sandbox-sdk-loadgen
    spec:
      serviceAccountName: sandbox-sdk-loadgen
      containers:
      - name: loadgen
        image: mindset-ap-southeast-1.cr.volces.com/g0031/cocoon-sandbox-sdk-loadgen:g0133-sdk1
        args:
        - --namespace=sandbox-sdk-loadgen
        - --concurrency=20
        - --total=0
        - --cleanup=true
        - --metrics-addr=:9090
        ports:
        - name: metrics
          containerPort: 9090
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-sdk-loadgen
  namespace: sandbox-sdk-loadgen
  labels:
    app: sandbox-sdk-loadgen
spec:
  selector:
    app: sandbox-sdk-loadgen
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
