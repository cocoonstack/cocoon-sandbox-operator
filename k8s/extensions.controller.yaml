---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: sandbox-operator
  namespace: cocoon-sandbox-system
  labels:
    app: sandbox-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-operator
  template:
    metadata:
      labels:
        app: sandbox-operator
    spec:
      serviceAccountName: sandbox-operator
      containers:
      - name: sandbox-operator
        image: ko://github.com/cocoonstack/sandbox-operator/cmd/sandbox-operator # placeholder value, replaced by deployment scripts
        args:
        - "--leader-elect=true"
        - "--extensions=true"
        - "--default-runtime=standard"
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: healthz
          containerPort: 8081
          protocol: TCP
        - name: webhook
          containerPort: 9443
          protocol: TCP
        volumeMounts:
        - name: config-volume
          mountPath: /etc/sandbox-config
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: cocoon-sandbox-config
          optional: true
