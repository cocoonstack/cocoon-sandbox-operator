---
kind: Namespace
apiVersion: v1
metadata:
  name: cocoon-sandbox-system

---

kind: ServiceAccount
apiVersion: v1
metadata:
  name: sandbox-operator
  namespace: cocoon-sandbox-system
  labels:
    app: sandbox-operator

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-operator
subjects:
- kind: ServiceAccount
  name: sandbox-operator
  namespace: cocoon-sandbox-system
roleRef:
  kind: ClusterRole
  name: sandbox-operator
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-operator
  namespace: cocoon-sandbox-system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ""
  resourceNames:
  - cocoon-sandbox-webhook-certs
  resources:
  - secrets
  verbs:
  - get
  - patch
  - update

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-operator
  namespace: cocoon-sandbox-system
subjects:
- kind: ServiceAccount
  name: sandbox-operator
  namespace: cocoon-sandbox-system
roleRef:
  kind: Role
  name: sandbox-operator
  apiGroup: rbac.authorization.k8s.io

---

kind: Service
apiVersion: v1
metadata:
  name: sandbox-operator
  namespace: cocoon-sandbox-system
  labels:
    app: sandbox-operator
spec:
  selector:
    app: sandbox-operator
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP

---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: sandbox-operator
  namespace: cocoon-sandbox-system
  labels:
    app: sandbox-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-operator
  template:
    metadata:
      labels:
        app: sandbox-operator
    spec:
      serviceAccountName: sandbox-operator
      containers:
      - name: sandbox-operator
        image: ko://github.com/cocoonstack/sandbox-operator/cmd/sandbox-operator # placeholder value, replaced by deployment scripts
        args:
        - --leader-elect=true
        - --extensions=true
        - --default-runtime=standard
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: healthz
          containerPort: 8081
          protocol: TCP
        - name: webhook
          containerPort: 9443
          protocol: TCP

---

kind: Service
apiVersion: v1
metadata:
  name: cocoon-sandbox-webhook-service
  namespace: cocoon-sandbox-system
spec:
  selector:
    app: sandbox-operator
  ports:
  - name: webhook
    port: 443
    targetPort: 9443
    protocol: TCP
