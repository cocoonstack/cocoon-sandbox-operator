apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-operator
  namespace: {{ include "agent-sandbox.namespace" . }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: sandbox-operator
  namespace: {{ include "agent-sandbox.namespace" . }}
roleRef:
  kind: Role
  name: sandbox-operator
  apiGroup: rbac.authorization.k8s.io
