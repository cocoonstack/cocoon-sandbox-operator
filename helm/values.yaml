namespace:
  # create controls whether the namespace is created by this chart.
  create: true
  name: cocoon-sandbox-system

image:
  repository: ghcr.io/cocoonstack/cocoon-sandbox-operator
  tag: ""  # required
  pullPolicy: IfNotPresent

replicaCount: 1

# podAnnotations are added to the controller pod template.
# Useful for service-mesh sidecar injection toggles, Prometheus scrape
# autodiscovery (e.g. Datadog `ad.datadoghq.com/...`), or any platform-
# specific pod-level annotation.
podAnnotations: {}
  # ad.datadoghq.com/cocoon-sandbox-operator.check_names: '["openmetrics"]'
  # ad.datadoghq.com/cocoon-sandbox-operator.init_configs: '[{}]'
  # ad.datadoghq.com/cocoon-sandbox-operator.instances: |
  #   [{"openmetrics_endpoint": "http://%%host%%:8080/metrics", "namespace": "agent_sandbox", "metrics": [".*"]}]

# podLabels are added to the controller pod template, in addition to
# the chart's selector labels. Useful for cost-allocation labels,
# network policy selectors, or pod-level metadata.
podLabels: {}
  # team: platform

controller:
  ##### Unset flags are omitted
  # clusterDomain: "cluster.local"
  leaderElect: true
  # leaderElectionNamespace: ""
  extensions: true
  # defaultRuntime selects the Pod backend. Standard kubelet is the rollout
  # default; set sandbox.cocoonstack.io/runtime=vk-cocoon on a Pod template to
  # opt one Sandbox into a ready vk-cocoon cluster.
  defaultRuntime: standard
  # enableTracing: false
  # enablePprof: false
  # enablePprofDebug: false
  # pprofBlockProfileRate: 1000000
  # pprofMutexProfileFraction: 10
  # kubeApiQps: -1.0
  # kubeApiBurst: 10
  # sandboxConcurrentWorkers: 1
  ##### The following are only active when controller.extensions=true.
  # sandboxClaimConcurrentWorkers: 50
  # sandboxWarmPoolConcurrentWorkers: 1
  # sandboxTemplateConcurrentWorkers: 1
  # sandboxWarmPoolMaxBatchSize: 300  # max parallel sandbox create/delete batch in the SandboxWarmPool controller
  # enableWarmPoolEviction: true      # mark warm-pool-created pods as safe to evict
  ##### extraArgs passes additional flags not listed above (e.g. zap logging flags).
  extraArgs: []

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 128Mi
  # requests:
  #   cpu: 10m
  #   memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Pod-level securityContext (spec.template.spec.securityContext). Default null — omitted unless set.
# Example for Kyverno / restricted Pod Security:
# podSecurityContext:
#   runAsNonRoot: true
#   seccompProfile:
#     type: RuntimeDefault
podSecurityContext: null

# Container-level securityContext for the controller. Default null — omitted unless set.
# Example:
# containerSecurityContext:
#   allowPrivilegeEscalation: false
#   capabilities:
#     drop:
#       - ALL
#   runAsNonRoot: true
#   seccompProfile:
#     type: RuntimeDefault
containerSecurityContext: null

# Name of the webhook service.
webhookServiceName: cocoon-sandbox-webhook-service
