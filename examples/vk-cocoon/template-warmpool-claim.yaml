apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: cocoon-agent
spec:
  networkPolicyManagement: Unmanaged
  envVarsInjectionPolicy: Allowed
  podTemplate:
    metadata:
      annotations:
        sandbox.cocoonstack.io/runtime: vk-cocoon
    spec:
      containers:
        - name: agent
          image: ghcr.io/cocoonstack/sandbox/agent:latest
          env:
            - name: SANDBOX_READY
              value: "true"
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: cocoon-agent
spec:
  replicas: 2
  sandboxTemplateRef:
    name: cocoon-agent
  updateStrategy:
    type: OnReplenish
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: cocoon-agent-example
spec:
  warmPoolRef:
    name: cocoon-agent
  env:
    - name: TASK_ID
      value: example-001
  lifecycle:
    shutdownPolicy: DeleteForeground
